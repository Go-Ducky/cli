name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"

  binaries:
    name: Build binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build platform binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          PLATFORMS=(
            "windows amd64 .exe"
            "windows arm64 .exe"
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
          )
          for p in "${PLATFORMS[@]}"; do
            set -- $p
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=0.1.0" \
              -o "dist/goducky-$1-$2${3:-}" ./cmd/goducky
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: goducky-binaries
          path: dist/
          if-no-files-found: error
