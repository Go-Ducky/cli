name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.27'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build platform binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          PLATFORMS=(
            "windows amd64 .exe"
            "windows arm64 .exe"
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
          )
          for p in "${PLATFORMS[@]}"; do
            set -- $p
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/goducky-$1-$2$3" ./cmd/goducky
          done

      - name: Create universal macOS binary (lipo)
        run: |
          if command -v lipo >/dev/null 2>&1; then
            lipo -create \
              dist/goducky-darwin-amd64 \
              dist/goducky-darwin-arm64 \
              -output dist/goducky-darwin-universal
          fi

      - name: Compute sha256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload checksums as artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
