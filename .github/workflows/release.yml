name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  GO_VERSION: '1.27'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Determine version and release tag
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          else
            SHORT="$(git rev-parse --short HEAD)"
            VERSION="0.1.0-dev.${SHORT}"
            TAG="dev-${SHORT}"
            PRERELEASE="true"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"

      - name: Build platform binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          PLATFORMS=(
            "windows amd64 .exe"
            "windows arm64 .exe"
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
          )
          for p in "${PLATFORMS[@]}"; do
            set -- $p
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/goducky-$1-$2${3:-}" ./cmd/goducky
          done

      - name: Create universal macOS binary (lipo)
        run: |
          if command -v lipo >/dev/null 2>&1; then
            lipo -create \
              dist/goducky-darwin-amd64 \
              dist/goducky-darwin-arm64 \
              -output dist/goducky-darwin-universal
          fi

      - name: Compute sha256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Prune old dev releases
        if: env.PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --json tagName --jq '.[].tagName' 2>/dev/null | grep '^dev-' || true); do
            if [ "$tag" != "${{ env.TAG }}" ]; then
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: goducky ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true

      - name: Upload checksums as artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt